[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-prediction"
version = "1.0.0"
description = "Telecom customer churn prediction with an ANN, explainable per-customer drivers and a Streamlit app."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.52",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pytest-cov>=5.0", "pre-commit>=3.8"]

[project.scripts]
churn = "churn.cli:main"

[tool.setuptools.packages.find]
include = ["churn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "B905", "E501"]

[tool.mypy]
ignore_missing_imports = true
